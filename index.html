<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tells the browser both schemes are supported before the stylesheet loads: no white flash in dark mode. -->
  <meta name="color-scheme" content="light dark" />
  <title>Sean Perez</title>
  <meta name="description" content="Sean Perez: projects and code." />
  <link rel="canonical" href="https://seanperez-net.github.io/" />

</head>

      inline so they cost no request and take the theme colours; icons/ holds the source files.
