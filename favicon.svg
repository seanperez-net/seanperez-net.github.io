<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The tab icon. It follows the browser's light or dark setting on its own. -->
  <style>
    circle { fill: #3f5e92; }
    text { fill: #fff; font: 500 28px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      circle { fill: #aac7ff; }
      text { fill: #0a305f; }
    }
  </style>
  <circle cx="32" cy="32" r="32" />
  <text x="32" y="42" text-anchor="middle">SP</text>
</svg>
